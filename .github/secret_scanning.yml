# GitHub secret scanning: paths whose secret-looking strings are deliberate test vectors.
#
# ActraDeck is a redaction product, so its tests and a few docs/scripts carry fake keys and
# tokens on purpose (they must look real, or the redactor tests would prove nothing). These
# paths are the same set the local secret scan exempts: `OSS_SECRET_FIXTURE_PATHSPEC` in
# scripts/lib/oss-patterns.sh. Every other path is scanned, and a real secret anywhere else
# raises an alert (and is blocked on push when push protection is on).
#
# Keep this list equal to that pathspec. INV-SECRET-SCANNING-PATHS-IGNORE in
# scripts/test-release-prep.sh checks the shape of this list everywhere (it must keep the
# test-vector globs and ignore nothing broader) and, where scripts/lib/oss-patterns.sh is
# present, that the two lists are equal.
paths-ignore:
  - "**/test/**"
  - "**/e2e/**"
  - "**/__tests__/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.test.mts"
  - "**/*.test.js"
  - ".env.example"
  - ".github/workflows/ci.yml"
  - "docs/demo-90s.md"
  - "scripts/quickstart"
  - "scripts/record-setup-cast.sh"
