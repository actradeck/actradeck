name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# SEC-1 (監査): least-privilege GITHUB_TOKEN。verify/e2e/migrations は repo を read するだけ
#   (checkout/install/build/test/migrate を CI-local Postgres に対して実行・write/upload なし)。
#   read に固定し、compromised な依存 lifecycle script が write スコープ token を得る経路を断つ。
#   (CodeQL は codeql.yml 側で security-events:write を job スコープで持つ。)
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # 3#QA-1: 唯一の実DB INV (INV-EVENT-DB-INTEGRITY) を CI で実走させるため Postgres を起動。
    #   DATABASE_URL 未供給だと db テストが describe.skipIf で常時 skip され不変条件が空振りする。
    #   CI service は標準ポート 5432 で公開 (ローカル docker compose の host 55432 とは別。
    #   DATABASE_URL を CI 用に 5432 で設定して整合させる)。migrations job と同一の接続規約。
    services:
      postgres:
        image: postgres:17.5-alpine@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
        env:
          POSTGRES_USER: actradeck
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: actradeck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U actradeck -d actradeck"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://actradeck:ci_local_only@localhost:5432/actradeck
      # PUBLIC OSS CI cannot install/auth the claude & codex binaries (install + API-key cost),
      #   so the real-binary e2e (INV-ATTACH-E2E / INV-CODEX-E2E) opt out of their
      #   CI-requires-binary guard and gracefully skip. DB-required e2e still run (Postgres
      #   service above). Deterministic Attach/normalization is covered by the e2e job's
      #   hook-replay (no real binary). No-op in jobs that don't run those tests.
      ACTRADECK_SKIP_REAL_BIN_E2E: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.28.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.16.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 再#2 SEC-1: INV-DEP-AUDIT — 既知脆弱性 High/Critical=0 を CI で強制 (security.md)。
      #   High/Critical advisory が transitive 依存に入ると exit≠0 で赤。moderate 以下は許容
      #   (--audit-level=high)。誤検出の一時抑止は ADR + 期限付き allowlist のみ (accepted-risk 禁止)。
      - name: Dependency audit (INV-DEP-AUDIT, fail on High/Critical)
        run: pnpm audit --audit-level=high

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format

      # CI-BUILD (公開 CI 初回失敗の是正): workspace ライブラリ (event-model / projection /
      #   redaction / design-tokens / backend / sidecar) は package exports が `./dist/*` のみ (src フォールバック
      #   なし) のため、それらを import する type-check / test / e2e は **dist が無いと失敗する**
      #   (projection の `tsc --noEmit` が @actradeck/event-model を解決できず exit2 / sidecar e2e が
      #   dist/index.js を ERR_MODULE_NOT_FOUND)。消費ステップの前に topological order で全パッケージを
      #   ビルドして dist を供給する。これにより後段の個別ビルド (backend:Build / design-tokens:Build /
      #   webui:Build=BUILD-1 production build gate) は dist 供給としては冗長な no-op 再ビルドになる
      #   (それぞれ step 順序契約 / 本番ビルドゲートとして残置)。重複(特に webui の二重 next build)解消は
      #   tech-debt sweep 課題 (QA-1/TDA-1)。ローカル開発(dist 既存)では緑でも clean CI では未ビルドで
      #   赤化する class を構造的に塞ぐことを優先する。
      - name: Build workspace (provide dist for type-check/test/e2e; topological)
        run: pnpm run build

      - name: Type check
        run: pnpm run type-check

      # SEC-1 (Phase 2 監査・decision 019f1c85 landing): shell orchestrator の CLI 契約 +
      #   no-secret-in-argv/plist スモークを CI で実行する。これまで scripts/test-*.sh は
      #   どこからも呼ばれず (ci.yml/Makefile/hook/pnpm script いずれも不在) = dead gate で、
      #   systemd unit / launchd plist に秘匿が inline される回帰を CI が素通りさせていた。
      #   print-unit / print-plist の秘匿非混入・XML well-formed (python3 plistlib)・verb dispatch を
      #   静的に固定する (DB/network 不要・node + python3 のみ・build 後で dist 前提を満たす)。
      #   QA-1: 秘匿名ゲートの vacuous 化 (pipefail×SIGPIPE 偽 PASS) を変数捕捉へ修正済。
      - name: Orchestrator script smoke (no-secret-in-argv, unit/plist contracts)
        run: |
          pnpm run test:public-metrics
          pnpm run test:telemetry-cli
          bash scripts/test-actradeck.sh
          bash scripts/test-ad-attach.sh
          bash scripts/test-install.sh
          bash scripts/test-install-e2e.sh
          # Import-flow sanitizer gate (外部評価R2 #2・decision 019f4fc1): 旧 mirror 時代の
          # import-oss-pr.sh (untrusted-input 面の falsifiability テスト)。2026-07-18 の
          # canonical cutover で import ツールは retire 済み (PR は通常 merge)。ツールは
          # どの checkout にも存在しないため存在ガードが常に graceful skip する
          # (absent-path self-adapt・機構は将来の復活にも耐えるためそのまま残す)。
          if [ -f scripts/test-import-oss-pr.sh ]; then
            bash scripts/test-import-oss-pr.sh
          else
            echo "test-import-oss-pr.sh absent (retired at the canonical cutover) — import-flow gate skipped"
          fi
          # decision 019fcdf4: ci-preflight の drift tripwire + assert-inv-ran の falsifiability を
          # CI 側でも固定する (メタテスト。tripwire が本物の ci.yml と一致することの検証も兼ねる —
          # ここが RED になったら scripts/ci-preflight.sh の MIRRORED_STEPS を ci.yml に合わせること)。
          bash scripts/test-ci-preflight.sh

      # Landing drift + idempotency gate (docs-lp QA-1・sweep 019f3d77 / decision 019f3d77).
      #   landing/ja/<slug> と landing/en/index.html は bilingual source から **生成**され commit
      #   される。以前は再生成ガードが CI に無く、(a) gen-ja-topic-pages の非冪等バグ (末尾空行の
      #   累積・実害あり f5853ba で修正) や (b) source を編集して ja/en を再生成し忘れる drift を
      #   CI が素通りさせていた。ここで committed 生成物が再生成と一致することを固定する:
      #     - gen-ja を **2 回**実行 (冪等性: 2 回目で出力が動けば非冪等 → git diff で RED)。
      #     - verify-en-landing で landing/en が landing/index.html と in-sync か (in-memory 比較)。
      #     - git diff --exit-code landing/ で committed 生成物 == 再生成 を assert (source drift 込み)。
      #   jsdom は apps/webui 依存 (install 済)。実害は marketing HTML の churn のみ (secret/correctness
      #   非該当) だが、silent drift で公開ページが陳腐化するのを防ぐ軽量ゲート。
      #   **canonical では self-adapt**: `landing/` は maintainer overlay 専用で canonical repo は
      #   track しない (LP は landing-sync で別 website repo へ同期・decision 019f051f)。CI の
      #   checkout に landing/ が無ければ gate を graceful skip する (absent-path self-adapt)。
      #   これが無いと gen-ja-topic-pages が landing/ source の ENOENT で CI を赤化させる。
      - name: Landing gen idempotency + drift gate (docs-lp QA-1)
        run: |
          if [ ! -d landing ]; then
            echo "landing/ absent (maintainer-overlay surface) — landing gate is overlay-only; skipping."
            exit 0
          fi
          node scripts/gen-ja-topic-pages.mjs
          node scripts/gen-ja-topic-pages.mjs
          node scripts/verify-en-landing.mjs
          if ! git diff --exit-code -- landing/; then
            echo "::error::landing/ drifted — committed generated pages differ from regeneration."
            echo "Run: node scripts/gen-ja-topic-pages.mjs && node scripts/gen-en-landing.mjs, then commit landing/."
            exit 1
          fi

      # Release / supply-chain gate (ADR 0013): lockstep version single-source, tag↔version
      #   match, tarball has no internal/secret content, SBOM covers prod deps + carries no
      #   raw paths, release.yml permissions are least-privilege, and install.sh's verify
      #   path rejects a tampered/absent-attestation tarball. Needs the installed prod store
      #   (SBOM via pnpm licenses) — runs after Install; git + python3 present on the runner.
      #   Builds the tarball via `git archive HEAD` (the old private prepare-oss tooling
      #   retired at the canonical cutover; the absent-path branch is now the only path).
      #   Wiring it here keeps the gate from going dead.
      # SEC-PIN-R2-1 / TDA-PIN-R3-1: the supply-chain pin gates (INV-ACTIONS-SHA-PINNED /
      #   INV-IMAGE-DIGEST-PINNED) parse workflows/compose with PyYAML and fail-closed if it is
      #   absent. ubuntu-latest ships python3-yaml preinstalled, so we only VERIFY its presence —
      #   we deliberately do NOT `pip install` a fallback: an unpinned fetch inside a supply-chain
      #   pin gate is self-contradictory. If PyYAML is ever missing, this step fails LOUD.
      - name: Verify preinstalled PyYAML (no unpinned install)
        run: python3 -c "import yaml"

      - name: Release prep gate (version/SBOM/tarball/perms/install-verify)
        run: bash scripts/test-release-prep.sh

      # 3#QA-1: db テストが参照する events/sessions スキーマを用意 (実 Postgres)。
      - name: Migrate up (provision schema for real-DB INV)
        run: pnpm --filter @actradeck/db run migrate:up

      # 3#QA-1: db の INV-EVENT-DB-INTEGRITY は DATABASE_URL 到達時に **実走** する
      #   (skip ではなく pass)。skip を許さないため、実走を明示検証する guard を後段に置く。
      - name: Test
        run: pnpm run test

      # 可視化 (fix/test-flake-triage・QA-1・task 019f52d5): backend step (16df715) と同型の
      #   flake 盲目 — 旧 `vitest ... && node -e ...` は vitest exit≠0 で JSON 解析 node が
      #   走らず failed テスト名が step ログに出なかった。backend と対称の rc 捕捉形へ揃える:
      #   rm -f 先行 (stale JSON 回避) → `|| rc=$?` (default shell -e -o pipefail を `||` で抑止)
      #   → rc≠0 なら failed 名 (file + title) を印字して exit rc、rc=0 は従来の INV-skip/absent
      #   の歯を維持。vitest は grep へパイプせず一時ファイル経由 (pipefail×SIGPIPE 非該当)。
      #   decision 019fcdf4: 解析 node は inline から scripts/ci/assert-inv-ran.mjs へ抽出
      #   (db/backend/sidecar の 3 step + scripts/ci-preflight.sh の単一出所・挙動等価)。
      #   TDA-2: 「どの INV が実走必須か」の pattern も --suite preset として script 内に置く
      #   (呼び出し側に raw pattern を書かない = ci.yml↔preflight の意味的中核の非 pin 2 コピー排除)。
      - name: Assert real-DB INV actually RAN (not skipped)
        run: |
          rm -f /tmp/db-test.json
          rc=0
          pnpm --filter @actradeck/db exec vitest run --reporter=json --outputFile=/tmp/db-test.json || rc=$?
          RC=$rc node scripts/ci/assert-inv-ran.mjs /tmp/db-test.json --suite db

      # Phase3 ingestion: backend の実 PG INV (INV-IDEMPOTENCY / INV-EVENT-ORDER / WS server)
      #   が DATABASE_URL 到達時に **実走** する (skip ではなく pass) ことを保証する。
      #   db ガードと同型: skip を silent green にしないため、実走を明示検証する。
      #
      #   可視化 (fix/test-flake-triage・task 019f52d5): 旧実装は `vitest ... && node -e ...` の
      #   `&&` 連鎖だったため、vitest が exit≠0 になると JSON 解析 node が走らず **どのテストが
      #   落ちたか step ログに一切出なかった** (docs-only diff の単発赤 = flake の名前が取れない)。
      #   rc を `|| rc=$?` で捕捉し (default shell は -e -o pipefail ゆえ `||` で -e を抑止)、rc に
      #   関わらず JSON があれば解析、**rc≠0 なら failed テスト名 (file + title) を印字してから
      #   exit rc** へ再構成する。歯は不変: (a) INV skip → fail (b) vitest 失敗 → fail (rc 温存)
      #   (c) JSON 欠損/解析不能 → fail-loud。旧 stale JSON の偽 green を避けるため先頭で rm。
      #   bash-gate-pipefail-sigpipe 回避のため vitest は grep へパイプせず一時ファイル経由。
      #   4 ケース (green/INV-skip/failed+rc1/JSON 欠損) をローカル実走で検証済み。
      #   decision 019fcdf4: 解析 node は scripts/ci/assert-inv-ran.mjs へ抽出 (単一出所・挙動等価)。
      - name: Assert backend real-DB INV actually RAN (not skipped)
        run: |
          rm -f /tmp/backend-test.json
          rc=0
          pnpm --filter @actradeck/backend exec vitest run --reporter=json --outputFile=/tmp/backend-test.json || rc=$?
          RC=$rc node scripts/ci/assert-inv-ran.mjs /tmp/backend-test.json --suite backend

      # QA-2: backend もカバレッジ閾値ゲート付きで実行 (testing.md 目標。閾値割れで赤)。
      #   network 例外 (index.ts の listen / db.ts の pool 接続) は明示除外。コア
      #   (reducer / liveness / ingest-store) は sink/store 並みに高く張る。
      #   DATABASE_URL 到達下で実走し、実測直下の閾値割れを exit≠0 で赤判定する。
      - name: Test (backend coverage gate)
        run: pnpm --filter @actradeck/backend run test:coverage

      # R1 QA-1 (redaction coverage 退行是正): redactor.ts は sidecar 在籍時 sidecar coverage gate で
      #   per-file 閾値が ENFORCED だった。packages/redaction へ移設後、`pnpm run test` (= vitest run)
      #   は coverage を計算しないため floor が **dormant** (閾値割れでも exit 0) になっていた。専用
      #   coverage gate step を追加し、redactor.ts / redact-for-persist.ts の per-file floor + global
      #   floor を CI で実効化する (閾値割れで exit≠0)。
      - name: Test (redaction coverage gate)
        run: pnpm --filter @actradeck/redaction run test:coverage

      # R2 QA-1 (event-model coverage gate): D1 で足した provider slug 判定
      #   (provider.ts: isKnownProvider / PROVIDER_SLUG_RE / Provider schema) は `pnpm run test`
      #   (= vitest run) では coverage 非計算のため floor が dormant だった。専用 coverage gate step で
      #   provider.ts の 100-or-trip per-file floor + global erosion floor を CI で実効化する
      #   (閾値割れで exit≠0・redaction gate と同型)。
      - name: Test (event-model coverage gate)
        run: pnpm --filter @actradeck/event-model run test:coverage

      # egress#QA-1: sidecar の貫通 e2e (inv-egress-e2e.test.ts) は実 backend
      #   buildIngestionServer を **package entry (dist) 経由**で import する (test 専用 devDep)。
      #   dist が新鮮であることを保証するため sidecar gate の直前に backend を build する
      #   (Type check の tsc -b でも emit されるが、step 順序を契約として明示固定する)。
      - name: Build backend (provide dist for sidecar e2e import)
        run: pnpm --filter @actradeck/backend run build

      # QA-3: sidecar はカバレッジ閾値ゲート付きで実行 (testing.md 目標。閾値割れで赤)。
      #   egress#QA-1 の貫通 e2e (実 WsClient↔実 buildIngestionServer↔実 PG) も本ゲートが拾う
      #   (DATABASE_URL は job env で到達)。
      - name: Test (sidecar coverage gate)
        run: pnpm --filter @actradeck/sidecar run test:coverage

      # egress#QA-1: 貫通 e2e (INV-EGRESS-E2E) が DATABASE_URL 到達時に **実走** する
      #   (skip ではなく pass/fail) ことを保証する。db/backend ガードと同型: skip を silent green
      #   にしない。テストファイルがサイレント削除/skip されたら exit≠0 で赤。
      #   この e2e は path 欠落 / session_id 分裂 / explicit-mode 分裂の 3 class を CI で固定する。
      #   decision 019fcdf4: 解析 node は scripts/ci/assert-inv-ran.mjs へ抽出 (単一出所)。あわせて
      #   db/backend と同じ rc 捕捉形へ統一 (旧 `&&` 連鎖は vitest exit≠0 で failed 名が出なかった —
      #   fix/test-flake-triage が db/backend に施したのと同じ可視化・歯は不変)。
      - name: Assert egress e2e actually RAN (not skipped)
        run: |
          rm -f /tmp/sidecar-e2e.json
          rc=0
          pnpm --filter @actradeck/sidecar exec vitest run --reporter=json --outputFile=/tmp/sidecar-e2e.json || rc=$?
          RC=$rc node scripts/ci/assert-inv-ran.mjs /tmp/sidecar-e2e.json --suite sidecar-egress

      # 再#QA-4 (再監査 a547b9f2): webui の coverage 閾値 (vitest.config.ts: realtime core +
      #   liveness-display) を CI で実評価する。plain `vitest run` は閾値を見ないため dormant
      #   だった。--coverage 付きゲートで回帰時のカバレッジ低下を exit≠0 で赤判定する。
      - name: Test (webui coverage gate)
        run: pnpm --filter @actradeck/webui run test:coverage

      # R1 QA-1 (npm bootstrap CLI・ADR 019f5131 Phase 3): packages/cli の per-file/global
      #   coverage floor (vitest.config.ts) を CI で実効化する。plain `vitest run` は閾値を
      #   見ないため dormant。特に checksum.ts (digest 検証・security core) の erosion tripwire
      #   を発火させる。PATH フィルタ (`./packages/cli`) を使う — CLI の unscoped 名 `actradeck`
      #   は root と衝突するため、名前衝突耐性のある path 指定にする (webui build gate 等と同 idiom)。
      #   この step は公開ミラー CI (ci.yml は shipped) でも走る。
      - name: Test (cli coverage gate)
        run: pnpm --filter ./packages/cli run test:coverage

      # Adaptive Clarity (ADR 019ea263): webui は @actradeck/design-tokens の dist/tokens.css を
      #   layout.tsx で import する。dist は gitignore のため、webui build/smoke の前にトークンを
      #   生成する (DTCG .tokens.json → CSS custom properties + INV-A11Y-CONTRAST はビルド前に test 済)。
      - name: Build design-tokens (generate --ad-* CSS for webui)
        run: pnpm --filter @actradeck/design-tokens run build

      # BUILD-1 (APPROVE 019e9307 検証ギャップの是正): tsc/test/eslint は通っても
      #   `next build` (Turbopack 本番ビルド) は別経路で失敗しうる (実例: 相対 import の
      #   `.js` 拡張子を Turbopack が解決できず build 不能だった)。成果物ビルドを CI ゲート化し、
      #   bundler 解決・型・静的生成の退行を exit≠0 で赤判定する。
      - name: Build (webui production build gate)
        run: pnpm --filter @actradeck/webui run build

      # BOOT-SMOKE (task 019e93e9 / QA-3 死角是正): 型/build/test 緑でも **実行時に server が
      #   起動しない** class を防ぐ。実 PostgreSQL に対し backend を本番 start (main-guard 経由) で、
      #   webui を本番 server.ts (prepare→listen) で **空きポートに実起動**し、
      #     - POST /ingest 無認証 → 401 (認証ゲート生存)
      #     - GET / → 200 / 配信 HTML に REALTIME_TOKEN/Bearer 非露出
      #     - headerless browser WS → BFF Bearer 中継 → backend snapshot.list 受信
      #   を検証する。DATABASE_URL は verify job の Postgres service。直前の build (.next) を再利用。
      - name: Boot smoke (real server bring-up gate)
        env:
          ACTRADECK_WEBUI_DIST_DIR: .next
        run: pnpm --filter @actradeck/webui run smoke:boot

  # 再#QA-2: 決定的 hook-replay E2E を CI に配線。実 HTTP/実 SQLite/実 WS を貫通し、
  # redaction 漏れ・最小タイムライン欠落を process.exit≠0 で赤判定する (REAL データ)。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.28.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.16.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # CI-BUILD: e2e:replay は実 sidecar (→ @actradeck/event-model の dist) を import するため、
      #   消費前に workspace をビルドして dist を供給する (verify ジョブと同じ理由・別ジョブなので再掲)。
      - name: Build workspace (provide dist for e2e runtime imports; topological)
        run: pnpm run build

      - name: E2E hook-replay (REAL HTTP/SQLite/WS, redaction leak = fail)
        run: pnpm --filter @actradeck/sidecar run e2e:replay

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.5-alpine@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
        env:
          POSTGRES_USER: actradeck
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: actradeck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U actradeck -d actradeck"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://actradeck:ci_local_only@localhost:5432/actradeck
      # PUBLIC OSS CI cannot install/auth the claude & codex binaries (install + API-key cost),
      #   so the real-binary e2e (INV-ATTACH-E2E / INV-CODEX-E2E) opt out of their
      #   CI-requires-binary guard and gracefully skip. DB-required e2e still run (Postgres
      #   service above). Deterministic Attach/normalization is covered by the e2e job's
      #   hook-replay (no real binary). No-op in jobs that don't run those tests.
      ACTRADECK_SKIP_REAL_BIN_E2E: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.28.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.16.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate up
        run: pnpm --filter @actradeck/db run migrate:up

      - name: Migrate down (rollback verification)
        run: pnpm --filter @actradeck/db run migrate:down

      - name: Migrate up again (idempotent re-apply)
        run: pnpm --filter @actradeck/db run migrate:up

  # R2-L4 + R3 root: which files affect the container IMAGE? Gate the (slower) image build+scan
  # job on this. R3-M-root widened the filter from packaging files ONLY to ALL image CONTENT
  # (apps/**, packages/**, db/**, root package.json) so that a coupling literal added to any
  # baked-in source RE-FIRES the authoritative real scan — the config-checkers alone cannot
  # catch a content leak (QA-R3-4). This is the structural end of the whack-a-mole: image
  # content changes ⟹ real FS scan runs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            docker:
              # packaging (how the image is assembled + scanned)
              - 'Dockerfile'
              - '.dockerignore'
              - 'scripts/docker-entrypoint.sh'
              - 'scripts/lib/scan-image-fs.sh'
              - 'scripts/lib/oss-patterns.sh'
              - '.github/workflows/release.yml'
              - '.github/workflows/ci.yml'
              - 'pnpm-lock.yaml'
              # image CONTENT (everything baked into /app — a leak can enter through any of these)
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - 'tsconfig.json'
              - 'apps/**'
              - 'packages/**'
              - 'db/**'

  # R2-L4: build the REAL cockpit image and scan its filesystem for leaks. This is the
  # AUTHORITATIVE leak gate (R3): the release.yml docker-job structure checks (INV-DOCKER-*)
  # can only assert the workflow is wired correctly — here we test actual image BEHAVIOR on
  # every image-content change. Single-sourced with release.yml via scripts/lib/scan-image-fs.sh.
  docker-image-scan:
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build cockpit image (load, no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          provenance: false
          tags: actradeck-ci-scan:pr

      - name: Scan image filesystem for leaks (fail-closed)
        run: |
          set -euo pipefail
          . scripts/lib/scan-image-fs.sh
          scan_image_fs actradeck-ci-scan:pr
