name: Release

# Signed, provenance-attested GitHub Release (ADR 0013 / decision 019f2bc1, Phase 1).
#
# This workflow SHIPS in the public mirror and fires when an annotated tag `vX.Y.Z`
# is pushed to the mirror (scripts/version.sh stamps the tag locally; scripts/sync-oss.sh
# carries it to the mirror with OSS_SYNC_TAGS=1). Because it runs INSIDE the mirror, the
# tree it archives is already sanitized by scripts/prepare-oss.sh (git archive of the tag).
#
# Assets: (1) source tarball (git archive of the tag), (2) CycloneDX SBOM of the
# production dependency closure (single-source scripts/lib/sbom.sh), (3) checksums.txt,
# each attested with SLSA build provenance (actions/attest-build-provenance -> keyless
# OIDC -> Sigstore). Consumers verify with `gh attestation verify`.
#
# The RELEASE signature (ephemeral OIDC cert, CI artifact) is deliberately a DIFFERENT
# trust root from the product's AUDIT-EXPORT signature (long-lived operator Ed25519,
# runtime data). The audit key is NEVER reused to sign releases.
#
# Name-agnostic: repo/owner come from ${{ github.repository }}, tag from
# ${{ github.ref_name }} — no owner/org is hardcoded (the final public org name is
# still unresolved and irrelevant to this workflow, which resolves it at run time).
#
# Action pin policy: matches .github/workflows/ci.yml (major-tag pins, e.g. @v4). The
# repo does not SHA-pin actions today; kept consistent here rather than mixing schemes.

on:
  push:
    tags:
      - "v*"
  # Manual opt-in path for the GHCR Docker image job ONLY (see the `docker` job's `if:`).
  # Dispatch this against an existing `vX.Y.Z` tag to build+sign+push the image. The
  # verify/release jobs are guarded to `push` events, so a dispatch never re-cuts a
  # Release — it only exercises the (USER-GATED) docker job.
  workflow_dispatch:

# Least-privilege by default: the whole workflow only READS the repo. The release job
# alone escalates (job-scoped) to the writes it needs. INV-PERMS-MINIMAL (the gate name
# emitted by scripts/test-release-prep.sh) asserts top-level == {contents: read} and that
# write lives only in the signing jobs.
permissions:
  contents: read

jobs:
  # --- verify: the tag is buildable and its version matches the tag ------------
  verify:
    runs-on: ubuntu-latest
    # Only cut a Release on an actual tag push. A workflow_dispatch (used to trigger the
    # USER-GATED docker job below) must NOT re-run verify/release on an existing tag.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: pnpm

      # INV-RELEASE-TAG-MATCHES-VERSION: the pushed tag MUST equal `v<root package.json
      # version>`. A lockstep bump (scripts/version.sh) stamps every package + the tag
      # together; this guards against tagging without stamping (or vice versa).
      - name: Assert tag matches package.json version
        run: |
          root_ver="$(jq -r '.version' package.json)"
          expected="v${root_ver}"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "::error::tag '${GITHUB_REF_NAME}' != package.json version '${expected}' — run scripts/version.sh ${root_ver} to stamp+tag in lockstep" >&2
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches root version ${root_ver}"

      # Lightweight buildability gate (full test/DB matrix runs in ci.yml on push to
      # main; here we only confirm the tagged tree installs, lints, and builds).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build workspace
        run: pnpm run build

  # --- release: cut tarball + SBOM, attest provenance, publish the Release ------
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release + upload assets
      id-token: write # keyless OIDC signing for attestations
      attestations: write # record the SLSA build provenance
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: pnpm

      - name: Compute release identifiers
        id: id
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "tag=${tag}"           >> "$GITHUB_OUTPUT"
          echo "version=${version}"   >> "$GITHUB_OUTPUT"
          echo "tarball=actradeck-${version}.tar.gz" >> "$GITHUB_OUTPUT"

      # The tarball IS the shipped artifact (D7: NO-LEAK invariant is pinned to the
      # git-archive tarball, not npm-pack). git archive of the tag = the sanitized
      # mirror tree, so it is leak-free by construction; the scan below is defense in depth.
      - name: Build source tarball (git archive of the tag)
        # SEC-1: tag-derived step outputs are passed via env (never interpolated into the
        # run: script body), so a crafted value cannot break out of the shell quoting.
        env:
          VERSION: ${{ steps.id.outputs.version }}
          TARBALL: ${{ steps.id.outputs.tarball }}
        run: |
          git archive --format=tar.gz \
            --prefix="actradeck-${VERSION}/" \
            -o "${TARBALL}" "${GITHUB_REF_NAME}"

      # Install ONLY the production dependency store so the SBOM covers prod deps.
      # --ignore-scripts avoids native addon builds (better-sqlite3/node-pty) we don't
      # need just to enumerate the dependency graph.
      - name: Install production dependencies (for SBOM)
        run: pnpm install --prod --frozen-lockfile --ignore-scripts

      # Single-source SBOM generation (same scripts/lib/sbom.sh prepare-oss uses).
      - name: Generate CycloneDX SBOM (production deps)
        run: |
          . scripts/lib/sbom.sh
          sbom_generate . sbom.cdx.json

      # Defense-in-depth leak gate (release ABORTS on any hit): (a) forbidden internal
      # files must be absent from the tarball listing; (b) the SBOM passes the NO-RAW
      # self-scan. The tarball is git archive of the sanitized mirror, whose maintainer
      # coupling scan (maintainer home path, handle, project id) already ran at prepare-oss;
      # a GENERIC '/home/<user>/' tree scan is intentionally NOT used here because the
      # mirror legitimately ships synthetic example paths (/home/user, /home/me) in test
      # fixtures and the demo cast — that would fail every real release.
      - name: Re-scan tarball + SBOM for leaks (fail-closed)
        env:
          TARBALL: ${{ steps.id.outputs.tarball }} # SEC-1: via env, not run-body interpolation
        run: |
          set -euo pipefail
          . scripts/lib/sbom.sh
          tb="${TARBALL}"

          echo "== (a) forbidden internal files absent from tarball =="
          if tar tzf "$tb" | grep -aE '(^|/)(\.env|\.mcp\.json|CLAUDE\.md|AGENTS\.md|plan\.md)$|(^|/)\.claude/'; then
            echo "::error::forbidden internal file present in release tarball" >&2
            exit 1
          fi
          echo "ok: no forbidden files in tarball"

          echo "== (b) SBOM NO-RAW self-scan (generated data must carry no path/secret) =="
          sbom_scan_noraw sbom.cdx.json
          echo "ok: SBOM clean"

      - name: Generate checksums
        env:
          TARBALL: ${{ steps.id.outputs.tarball }} # SEC-1: via env, not run-body interpolation
        run: sha256sum "${TARBALL}" sbom.cdx.json > checksums.txt

      # SLSA build provenance (keyless OIDC -> Sigstore). Attests BOTH shipped assets.
      - name: Attest build provenance (tarball + SBOM)
        env:
          TARBALL: ${{ steps.id.outputs.tarball }} # SEC-1: reference via env below
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ env.TARBALL }}
            sbom.cdx.json

      # Publish the Release via the preinstalled gh CLI (no extra action dependency).
      # The body carries the consumer verification command, name-agnostic via the
      # ${{ github.repository }} context (owner/name resolved at run time).
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # SEC-1: all interpolated values enter via env, never the run: body.
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          TARBALL: ${{ steps.id.outputs.tarball }}
        run: |
          set -euo pipefail
          tag="${TAG}"
          repo="${REPO}"
          tarball="${TARBALL}"
          notes="$(cat <<EOF
          ## ActraDeck ${tag}

          Signed, provenance-attested release. Assets: source tarball, CycloneDX SBOM
          (\`sbom.cdx.json\`), and \`checksums.txt\`.

          ### Verify before you run it

          Confirm this tarball was built by this repository's release workflow (SLSA
          build provenance, keyless Sigstore signature):

          \`\`\`sh
          gh attestation verify ${tarball} --repo ${repo}
          sha256sum -c checksums.txt
          \`\`\`

          Or let the installer verify for you:

          \`\`\`sh
          ACTRADECK_VERIFY=1 ACTRADECK_REF=${tag} \\
            ACTRADECK_REPO=https://github.com/${repo} sh scripts/install.sh
          \`\`\`

          See CHANGELOG.md for what changed.
          EOF
          )"
          gh release create "$tag" \
            --repo "$repo" \
            --title "ActraDeck $tag" \
            --notes "$notes" \
            "$tarball" sbom.cdx.json checksums.txt

  # --- docker: build + push + cosign-sign the GHCR cockpit image (USER-GATED) ---
  # ADR 0013 Phase 2 (decision 019f2bc1 D1 / 019f305f). This job is OFF BY DEFAULT: a
  # plain tag push does NOT publish an image. It runs only when the operator opts in,
  # either by setting the repo variable `ENABLE_GHCR_PUBLISH=true` (then it rides along
  # with the tag push) or by manually dispatching this workflow against a `vX.Y.Z` tag.
  # It is independent of verify/release (no `needs:`), so it never affects the Release.
  #
  # The image is the cockpit stack only (backend + webui + embedded PGlite); the sidecar
  # runs on the HOST (docs/docker.md). Signing uses keyless OIDC -> Sigstore (cosign) +
  # a GitHub-native SLSA build-provenance attestation of the image digest — a DIFFERENT
  # trust root from the product's operator Ed25519 audit key (ADR 0013 D3), never reused.
  docker:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'workflow_dispatch' || vars.ENABLE_GHCR_PUBLISH == 'true')
    permissions:
      contents: read
      packages: write # push the image to GHCR
      id-token: write # keyless OIDC for cosign + attestation
      attestations: write # record the SLSA build provenance of the image
    steps:
      - uses: actions/checkout@v4

      # TDA-7: a workflow_dispatch reaches THIS job without the verify job's tag↔version
      # check (verify is guarded to `push` events). Without re-asserting it here, a dispatch
      # against a tag whose package.json version was never stamped could publish a
      # mislabeled image. Re-run the same assertion the verify job uses.
      - name: Assert tag matches package.json version
        run: |
          set -euo pipefail
          root_ver="$(jq -r '.version' package.json)"
          expected="v${root_ver}"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "::error::tag '${GITHUB_REF_NAME}' != package.json version '${expected}' — run scripts/version.sh ${root_ver} to stamp+tag in lockstep before publishing an image" >&2
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches root version ${root_ver}"

      # Name-agnostic: registry path derives from ${{ github.repository }} (GHCR requires
      # a lowercase path). SEC-1: tag/repo values are computed via env, never interpolated
      # into a later run: body (mirrors the release job's hardening).
      - name: Compute image reference
        id: img
        env:
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          repo_lc="$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
          version="${REF_NAME#v}"
          echo "image=ghcr.io/${repo_lc}" >> "$GITHUB_OUTPUT"
          echo "version=${version}"       >> "$GITHUB_OUTPUT"
          echo "resolved image=ghcr.io/${repo_lc} version=${version}"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # SEC-2: build → SCAN → push (never `push: true` before the leak scan). The release
      # job re-scans its tarball before publishing; the image had no equivalent gate, so a
      # single `push: true` build shipped to GHCR before anything inspected the filesystem.
      # We first build with `load: true` (into the local daemon, no push), scan that exact
      # image, and only then push. `provenance: false` disables BuildKit's inline provenance
      # attestor; we attest separately below with the GitHub-native action.
      - name: Build image locally (load, not yet pushed)
        id: build_local
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          provenance: false
          tags: |
            ${{ steps.img.outputs.image }}:${{ steps.img.outputs.version }}
            ${{ steps.img.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.img.outputs.version }}

      # AUTHORITATIVE image leak gate (R3): export the built image's filesystem and fail-closed
      # on any leak BEFORE pushing. This is the real enforcement — the config-checkers in
      # scripts/test-release-prep.sh only verify this step is wired in. Single-sourced via
      # scripts/lib/scan-image-fs.sh (R3-L1) so release.yml and ci.yml can't drift.
      - name: Scan built image filesystem for leaks (fail-closed, before push)
        env:
          IMAGE: ${{ steps.img.outputs.image }}
          VERSION: ${{ steps.img.outputs.version }}
        run: |
          set -euo pipefail
          . scripts/lib/scan-image-fs.sh
          scan_image_fs "${IMAGE}:${VERSION}"

      # AUTHORITATIVE publish gate (R4-M1a): a runtime re-check RIGHT BEFORE the push that fails
      # closed unless the tag∧opt-in conditions truly hold. This is the publish-face analogue of
      # the leak-face image scan: even if the job `if:` is weakened, publishing is blocked here.
      # The job `if:` (pinned to CANONICAL_IF by INV-GHCR-PUBLISH-GATED) is now the SECONDARY
      # check; this step is the enforcement. GITHUB_REF / GITHUB_EVENT_NAME are Actions built-ins;
      # ENABLE_GHCR_PUBLISH is passed via env (injection-safe idiom), never interpolated into the
      # script body.
      - name: Verify publish is authorized (runtime fail-closed guard)
        env:
          ENABLE_GHCR_PUBLISH: ${{ vars.ENABLE_GHCR_PUBLISH }}
        run: |
          set -euo pipefail
          case "${GITHUB_REF:-}" in
            refs/tags/*) : ;;
            *) echo "::error::publish guard: ref '${GITHUB_REF:-}' is not a tag — refusing to push" >&2; exit 1 ;;
          esac
          if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] || [ "${ENABLE_GHCR_PUBLISH:-}" = "true" ]; then
            echo "publish authorized (event=${GITHUB_EVENT_NAME:-}, ENABLE_GHCR_PUBLISH set: $([ "${ENABLE_GHCR_PUBLISH:-}" = "true" ] && echo yes || echo no))"
          else
            echo "::error::publish guard: not workflow_dispatch and ENABLE_GHCR_PUBLISH != 'true' — refusing to push" >&2
            exit 1
          fi

      # R2-L3: push the EXACT image that was just scanned — do NOT re-build. The load build
      # above put the image (with both tags) in the local daemon; we `docker push` those tags
      # so the pushed manifest is byte-identical to the scanned one (a second build-push-action
      # would be a distinct build with no digest-equality guarantee to the scanned image). The
      # pushed registry digest is captured for cosign + attestation. INV-DOCKER-SCAN-BEFORE-PUSH
      # pins that the push step does not re-build.
      - name: Push scanned image
        id: push
        env:
          IMAGE: ${{ steps.img.outputs.image }}
          VERSION: ${{ steps.img.outputs.version }}
        run: |
          set -euo pipefail
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"
          # Resolve the registry manifest digest of the just-pushed image (both tags share it).
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE}:${VERSION}" | cut -d'@' -f2)"
          case "$digest" in
            sha256:*) : ;;
            *) echo "::error::could not resolve pushed image digest (got '${digest}')" >&2; exit 1 ;;
          esac
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "pushed ${IMAGE}@${digest}"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless signature (OIDC -> Fulcio cert -> Rekor transparency log). Sign the exact
      # digest, not a mutable tag, so the signature binds the immutable image content.
      - name: Sign the image (cosign keyless)
        env:
          IMAGE: ${{ steps.img.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # SLSA build provenance for the image digest, pushed to the registry so consumers
      # can `gh attestation verify oci://<image>@<digest> --repo <owner>/<name>`.
      - name: Attest build provenance (image)
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.img.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
