name: Release

# Signed, provenance-attested GitHub Release (ADR 0013 / decision 019f2bc1, Phase 1).
#
# Fires ONCE when an annotated tag `vX.Y.Z` is pushed directly to this canonical
# repository (scripts/version.sh stamps the tag locally; the maintainer publishes it
# with `git push origin vX.Y.Z`). The maintainer-side pre-push gate scans the tag
# object (message, tagger identity) and the peeled commit range before the push
# leaves the machine; release-tag deletion/re-pointing is denied there by default.
# (Historical note: before the 2026-07-18 canonical cutover this repo was a curated
# mirror and the tag arrived via the retired sync pipeline.)
#
# Assets: (1) source tarball (git archive of the tag), (2) CycloneDX SBOM of the
# production dependency closure (single-source scripts/lib/sbom.sh), (3) checksums.txt,
# each attested with SLSA build provenance (actions/attest-build-provenance -> keyless
# OIDC -> Sigstore). Consumers verify with `gh attestation verify`.
#
# The RELEASE signature (ephemeral OIDC cert, CI artifact) is deliberately a DIFFERENT
# trust root from the product's AUDIT-EXPORT signature (long-lived operator Ed25519,
# runtime data). The audit key is NEVER reused to sign releases.
#
# Name-agnostic: repo/owner come from ${{ github.repository }}, tag from
# ${{ github.ref_name }} — no owner/org is hardcoded (the final public org name is
# still unresolved and irrelevant to this workflow, which resolves it at run time).
#
# Action pin policy: matches .github/workflows/ci.yml (major-tag pins, e.g. @v4). The
# repo does not SHA-pin actions today; kept consistent here rather than mixing schemes.

on:
  push:
    tags:
      - "v*"
  # Manual opt-in path for the USER-GATED publish jobs (`docker` and `npm`) ONLY — see each
  # job's `if:`. Dispatch this against an existing `vX.Y.Z` tag to build+sign+push the GHCR
  # image and/or publish the npm bootstrap CLI. The verify/release jobs are guarded to `push`
  # events, so a dispatch never re-cuts a Release — it only exercises the opt-in publish jobs.
  workflow_dispatch:

# Least-privilege by default: the whole workflow only READS the repo. The release job
# alone escalates (job-scoped) to the writes it needs. INV-PERMS-MINIMAL (the gate name
# emitted by scripts/test-release-prep.sh) asserts top-level == {contents: read} and that
# write lives only in the signing jobs.
permissions:
  contents: read

jobs:
  # --- verify: the tag is buildable and its version matches the tag ------------
  verify:
    runs-on: ubuntu-latest
    # Only cut a Release on an actual tag push. A workflow_dispatch (used to trigger the
    # USER-GATED docker job below) must NOT re-run verify/release on an existing tag.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.28.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.16.0"
          cache: pnpm

      # INV-RELEASE-TAG-MATCHES-VERSION: the pushed tag MUST equal `v<root package.json
      # version>`. A lockstep bump (scripts/version.sh) stamps every package + the tag
      # together; this guards against tagging without stamping (or vice versa).
      - name: Assert tag matches package.json version
        run: |
          root_ver="$(jq -r '.version' package.json)"
          expected="v${root_ver}"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "::error::tag '${GITHUB_REF_NAME}' != package.json version '${expected}' — run scripts/version.sh ${root_ver} to stamp+tag in lockstep" >&2
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches root version ${root_ver}"

      # Lightweight buildability gate (full test/DB matrix runs in ci.yml on push to
      # main; here we only confirm the tagged tree installs, lints, and builds).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build workspace
        run: pnpm run build

  # --- release: cut tarball + SBOM, attest provenance, publish the Release ------
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release + upload assets
      id-token: write # keyless OIDC signing for attestations
      attestations: write # record the SLSA build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.28.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.16.0"
          cache: pnpm

      - name: Compute release identifiers
        id: id
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "tag=${tag}"           >> "$GITHUB_OUTPUT"
          echo "version=${version}"   >> "$GITHUB_OUTPUT"
          echo "tarball=actradeck-${version}.tar.gz" >> "$GITHUB_OUTPUT"

      # The tarball IS the shipped artifact (D7: NO-LEAK invariant is pinned to the
      # git-archive tarball, not npm-pack). git archive of the tag = the sanitized
      # mirror tree, so it is leak-free by construction; the scan below is defense in depth.
      - name: Build source tarball (git archive of the tag)
        # SEC-1: tag-derived step outputs are passed via env (never interpolated into the
        # run: script body), so a crafted value cannot break out of the shell quoting.
        env:
          VERSION: ${{ steps.id.outputs.version }}
          TARBALL: ${{ steps.id.outputs.tarball }}
        run: |
          git archive --format=tar.gz \
            --prefix="actradeck-${VERSION}/" \
            -o "${TARBALL}" "${GITHUB_REF_NAME}"

      # Install ONLY the production dependency store so the SBOM covers prod deps.
      # --ignore-scripts avoids native addon builds (better-sqlite3/node-pty) we don't
      # need just to enumerate the dependency graph.
      - name: Install production dependencies (for SBOM)
        run: pnpm install --prod --frozen-lockfile --ignore-scripts

      # Single-source SBOM generation (same scripts/lib/sbom.sh prepare-oss uses).
      - name: Generate CycloneDX SBOM (production deps)
        run: |
          . scripts/lib/sbom.sh
          sbom_generate . sbom.cdx.json

      # Defense-in-depth leak gate (release ABORTS on any hit): (a) forbidden internal
      # files must be absent from the tarball listing; (b) the SBOM passes the NO-RAW
      # self-scan. The tarball is git archive of the sanitized mirror, whose maintainer
      # coupling scan (maintainer home path, handle, project id) already ran at prepare-oss;
      # a GENERIC '/home/<user>/' tree scan is intentionally NOT used here because the
      # mirror legitimately ships synthetic example paths (/home/user, /home/me) in test
      # fixtures and the demo cast — that would fail every real release.
      - name: Re-scan tarball + SBOM for leaks (fail-closed)
        env:
          TARBALL: ${{ steps.id.outputs.tarball }} # SEC-1: via env, not run-body interpolation
        run: |
          set -euo pipefail
          . scripts/lib/sbom.sh
          tb="${TARBALL}"

          echo "== (a) forbidden internal files absent from tarball =="
          if tar tzf "$tb" | grep -aE '(^|/)(\.env|\.mcp\.json|CLAUDE\.md|AGENTS\.md|plan\.md)$|(^|/)\.claude/'; then
            echo "::error::forbidden internal file present in release tarball" >&2
            exit 1
          fi
          echo "ok: no forbidden files in tarball"

          echo "== (b) SBOM NO-RAW self-scan (generated data must carry no path/secret) =="
          sbom_scan_noraw sbom.cdx.json
          echo "ok: SBOM clean"

      - name: Generate checksums
        env:
          TARBALL: ${{ steps.id.outputs.tarball }} # SEC-1: via env, not run-body interpolation
        run: sha256sum "${TARBALL}" sbom.cdx.json > checksums.txt

      # SLSA build provenance (keyless OIDC -> Sigstore). Attests BOTH shipped assets.
      - name: Attest build provenance (tarball + SBOM)
        env:
          TARBALL: ${{ steps.id.outputs.tarball }} # SEC-1: reference via env below
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            ${{ env.TARBALL }}
            sbom.cdx.json

      # Publish the Release via the preinstalled gh CLI (no extra action dependency).
      # The body carries the consumer verification command, name-agnostic via the
      # ${{ github.repository }} context (owner/name resolved at run time).
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # SEC-1: all interpolated values enter via env, never the run: body.
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          TARBALL: ${{ steps.id.outputs.tarball }}
        run: |
          set -euo pipefail
          tag="${TAG}"
          repo="${REPO}"
          tarball="${TARBALL}"
          notes="$(cat <<EOF
          ## ActraDeck ${tag}

          Signed, provenance-attested release. Assets: source tarball, CycloneDX SBOM
          (\`sbom.cdx.json\`), and \`checksums.txt\`.

          ### Verify before you run it

          Confirm this tarball was built by this repository's release workflow (SLSA
          build provenance, keyless Sigstore signature):

          \`\`\`sh
          gh attestation verify ${tarball} --repo ${repo}
          sha256sum -c checksums.txt
          \`\`\`

          Or let the installer verify for you:

          \`\`\`sh
          ACTRADECK_VERIFY=1 ACTRADECK_REF=${tag} \\
            ACTRADECK_REPO=https://github.com/${repo} sh scripts/install.sh
          \`\`\`

          See CHANGELOG.md for what changed.
          EOF
          )"
          gh release create "$tag" \
            --repo "$repo" \
            --title "ActraDeck $tag" \
            --notes "$notes" \
            "$tarball" sbom.cdx.json checksums.txt

  # --- docker: build + push + cosign-sign the GHCR cockpit image (USER-GATED) ---
  # ADR 0013 Phase 2 (decision 019f2bc1 D1 / 019f305f). This job is OFF BY DEFAULT: a
  # plain tag push does NOT publish an image. It runs only when the operator opts in,
  # either by setting the repo variable `ENABLE_GHCR_PUBLISH=true` (then it rides along
  # with the tag push) or by manually dispatching this workflow against a `vX.Y.Z` tag.
  # It is independent of verify/release (no `needs:`), so it never affects the Release.
  #
  # The image is the cockpit stack only (backend + webui + embedded PGlite); the sidecar
  # runs on the HOST (docs/docker.md). Signing uses keyless OIDC -> Sigstore (cosign) +
  # a GitHub-native SLSA build-provenance attestation of the image digest — a DIFFERENT
  # trust root from the product's operator Ed25519 audit key (ADR 0013 D3), never reused.
  docker:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'workflow_dispatch' || vars.ENABLE_GHCR_PUBLISH == 'true')
    permissions:
      contents: read
      packages: write # push the image to GHCR
      id-token: write # keyless OIDC for cosign + attestation
      attestations: write # record the SLSA build provenance of the image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # TDA-7: a workflow_dispatch reaches THIS job without the verify job's tag↔version
      # check (verify is guarded to `push` events). Without re-asserting it here, a dispatch
      # against a tag whose package.json version was never stamped could publish a
      # mislabeled image. Re-run the same assertion the verify job uses.
      - name: Assert tag matches package.json version
        run: |
          set -euo pipefail
          root_ver="$(jq -r '.version' package.json)"
          expected="v${root_ver}"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "::error::tag '${GITHUB_REF_NAME}' != package.json version '${expected}' — run scripts/version.sh ${root_ver} to stamp+tag in lockstep before publishing an image" >&2
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches root version ${root_ver}"

      # Name-agnostic: registry path derives from ${{ github.repository }} (GHCR requires
      # a lowercase path). SEC-1: tag/repo values are computed via env, never interpolated
      # into a later run: body (mirrors the release job's hardening).
      - name: Compute image reference
        id: img
        env:
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          repo_lc="$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
          version="${REF_NAME#v}"
          echo "image=ghcr.io/${repo_lc}" >> "$GITHUB_OUTPUT"
          echo "version=${version}"       >> "$GITHUB_OUTPUT"
          echo "resolved image=ghcr.io/${repo_lc} version=${version}"

      # setup-qemu registers binfmt_misc handlers (QEMU user-mode) so buildx can emulate
      # linux/arm64 on the amd64 runner — required for the arm64 half of the multi-arch image
      # (external eval R2 #6 / decision 019f4fc1: Apple Silicon support). Full-SHA-pinned like
      # every other action (INV-ACTIONS-SHA-PINNED); v4.2.0 matches setup-buildx-action below.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # SEC-2 (multi-arch): build → SCAN → push, now PER-ARCHITECTURE. buildx cannot `--load` a
      # multi-platform manifest list into the docker daemon, so we build EACH platform singly with
      # `--load` (into the local daemon, no push) AND persist its layers to a local cache. The arm64
      # half builds under QEMU emulation (setup-qemu-action). Every per-arch image is scanned below;
      # the multi-arch push then re-plays the SAME layers from that cache (`--cache-from` per arch),
      # so the pushed manifest-list content is the scanned content re-played from cache rather than a
      # fresh rebuild (on a cache miss buildx rebuilds; the leak-relevant /app tree is a deterministic
      # allowlist COPY = leak-equivalent, and strict byte-identity is not relied upon — the INV instead
      # requires a --cache-from per scanned arch). `provenance=false` disables BuildKit's inline
      # provenance attestor; we attest separately below with the GitHub-native action.
      # INV-DOCKER-SCAN-BEFORE-PUSH pins that EVERY pushed platform was scanned first AND that the push
      # carries a --cache-from for each arch (per-arch coverage + cache parity), not just the first one.
      - name: Build per-arch images locally (load, not yet pushed)
        id: build_local
        env:
          IMAGE: ${{ steps.img.outputs.image }}
          VERSION: ${{ steps.img.outputs.version }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker buildx build \
              --platform "linux/${arch}" \
              --load \
              --provenance=false \
              --cache-to "type=local,mode=max,dest=/tmp/adcache-${arch}" \
              --label "org.opencontainers.image.source=${SOURCE}" \
              --label "org.opencontainers.image.revision=${REVISION}" \
              --label "org.opencontainers.image.version=${VERSION}" \
              -t "${IMAGE}:${VERSION}-${arch}" \
              .
          done

      # AUTHORITATIVE image leak gate (R3): export EACH built per-arch image's filesystem and
      # fail-closed on any leak BEFORE pushing. This is the real enforcement — the config-checkers
      # in scripts/test-release-prep.sh only verify this step is wired in (and now that every
      # pushed arch is covered). Single-sourced via scripts/lib/scan-image-fs.sh (R3-L1) so
      # release.yml and ci.yml can't drift.
      - name: Scan built per-arch image filesystems for leaks (fail-closed, before push)
        env:
          IMAGE: ${{ steps.img.outputs.image }}
          VERSION: ${{ steps.img.outputs.version }}
        run: |
          set -euo pipefail
          . scripts/lib/scan-image-fs.sh
          for arch in amd64 arm64; do
            scan_image_fs "${IMAGE}:${VERSION}-${arch}"
          done

      # AUTHORITATIVE publish gate (R4-M1a): a runtime re-check RIGHT BEFORE the push that fails
      # closed unless the tag∧opt-in conditions truly hold. This is the publish-face analogue of
      # the leak-face image scan: even if the job `if:` is weakened, publishing is blocked here.
      # The job `if:` (pinned to CANONICAL_IF by INV-GHCR-PUBLISH-GATED) is now the SECONDARY
      # check; this step is the enforcement. GITHUB_REF / GITHUB_EVENT_NAME are Actions built-ins;
      # ENABLE_GHCR_PUBLISH is passed via env (injection-safe idiom), never interpolated into the
      # script body.
      - name: Verify publish is authorized (runtime fail-closed guard)
        env:
          ENABLE_GHCR_PUBLISH: ${{ vars.ENABLE_GHCR_PUBLISH }}
        run: |
          set -euo pipefail
          case "${GITHUB_REF:-}" in
            refs/tags/*) : ;;
            *) echo "::error::publish guard: ref '${GITHUB_REF:-}' is not a tag — refusing to push" >&2; exit 1 ;;
          esac
          if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] || [ "${ENABLE_GHCR_PUBLISH:-}" = "true" ]; then
            echo "publish authorized (event=${GITHUB_EVENT_NAME:-}, ENABLE_GHCR_PUBLISH set: $([ "${ENABLE_GHCR_PUBLISH:-}" = "true" ] && echo yes || echo no))"
          else
            echo "::error::publish guard: not workflow_dispatch and ENABLE_GHCR_PUBLISH != 'true' — refusing to push" >&2
            exit 1
          fi

      # R2-L3 (multi-arch): re-play the layers that were just scanned — buildx re-assembles the
      # multi-platform manifest list FROM THE LOCAL CACHE the per-arch `--load` builds wrote
      # (`--cache-from` for each arch), so the pushed per-arch layers are the scanned ones re-played
      # from cache rather than a fresh rebuild (on a cache miss buildx rebuilds; the /app tree is a
      # deterministic allowlist COPY = leak-equivalent, so strict byte-identity is not relied upon).
      # A single multi-platform `--push` build emits ONE manifest list (OCI image index) covering both
      # arches; its digest — read from `--metadata-file` (containerimage.digest) — is the INDEX digest
      # that cosign signs and attest-build-provenance attests (the index digest binds BOTH arch
      # manifests). INV-DOCKER-SCAN-BEFORE-PUSH pins that this push publishes only platforms scanned
      # above AND carries a --cache-from for each of them.
      - name: Push scanned image (multi-arch manifest list)
        id: push
        env:
          IMAGE: ${{ steps.img.outputs.image }}
          VERSION: ${{ steps.img.outputs.version }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --cache-from "type=local,src=/tmp/adcache-amd64" \
            --cache-from "type=local,src=/tmp/adcache-arm64" \
            --provenance=false \
            --label "org.opencontainers.image.source=${SOURCE}" \
            --label "org.opencontainers.image.revision=${REVISION}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest" \
            --metadata-file /tmp/buildx-meta.json \
            --push \
            .
          # The manifest-list (OCI image index) digest — binds both arch manifests; both tags share it.
          digest="$(jq -r '.["containerimage.digest"]' /tmp/buildx-meta.json)"
          case "$digest" in
            sha256:*) : ;;
            *) echo "::error::could not resolve pushed manifest-list digest (got '${digest}')" >&2; exit 1 ;;
          esac
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "pushed ${IMAGE}@${digest} (multi-arch index: linux/amd64, linux/arm64)"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signature (OIDC -> Fulcio cert -> Rekor transparency log). Sign the exact
      # MANIFEST-LIST (index) digest, not a mutable tag — the index binds both the amd64 and
      # arm64 manifests, so one signature covers the whole multi-arch image content.
      - name: Sign the image (cosign keyless)
        env:
          IMAGE: ${{ steps.img.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # SLSA build provenance for the manifest-list (index) digest, pushed to the registry so
      # consumers can `gh attestation verify oci://<image>@<index-digest> --repo <owner>/<name>`
      # regardless of which arch they pull (the index digest is arch-independent).
      - name: Attest build provenance (image)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.img.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # --- npm: publish the bootstrap CLI via Trusted Publishing (OIDC) (USER-GATED) ---
  # ADR 0013 Phase 3 (decision 019f5131). Publishes ONLY packages/cli (the sole publishable
  # package; every other workspace stays private:true). Same TWO-LAYER gate as the docker job:
  #   (1) this job `if:` — pinned to CANONICAL_NPM_IF by INV-NPM-PUBLISH-GATED (closed-enum,
  #       tag-guarded, exact AST match), and
  #   (2) a runtime publish guard step that fails closed RIGHT BEFORE `npm publish` unless the
  #       ref is a tag AND (workflow_dispatch OR vars.ENABLE_NPM_PUBLISH == 'true') truly holds.
  # OFF BY DEFAULT: a plain tag push does NOT publish to npm. It is independent of verify/release
  # (no `needs:`), so it never affects the signed GitHub Release.
  #
  # Trusted Publishing (npm OIDC, GA 2025-07): NO long-lived npm token. The job mints a
  # short-lived OIDC token (id-token: write, job-scoped) that npm (>= 11.5.1) exchanges for a
  # publish credential, and generates provenance automatically. Because a PRIVATE repo does not
  # produce provenance, this workflow MUST run inside the PUBLIC mirror (actradeck/actradeck) —
  # a structural requirement, not a policy. The npmjs.com Trusted Publisher config
  # (org/repo/workflow filename/environment) is USER-GATED (set once by the maintainer).
  npm:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && (github.event_name == 'workflow_dispatch' || vars.ENABLE_NPM_PUBLISH == 'true')
    permissions:
      contents: read
      id-token: write # OIDC token exchange for npm Trusted Publishing (no npm token stored)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.28.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.16.0"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      # Lockstep + tag agreement (same posture as verify's assert, extended to the CLI package).
      # A workflow_dispatch reaches THIS job WITHOUT verify's push-gated tag↔version check, so we
      # re-assert here: the pushed tag MUST equal v<root version> AND the CLI's own version MUST
      # equal root (lockstep), or a mislabeled package could be published.
      - name: Assert tag == root == cli package version
        run: |
          set -euo pipefail
          root_ver="$(jq -r '.version' package.json)"
          cli_ver="$(jq -r '.version' packages/cli/package.json)"
          expected="v${root_ver}"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "::error::tag '${GITHUB_REF_NAME}' != root version '${expected}' — run scripts/version.sh ${root_ver} to stamp+tag in lockstep" >&2
            exit 1
          fi
          if [ "${cli_ver}" != "${root_ver}" ]; then
            echo "::error::packages/cli version '${cli_ver}' != root version '${root_ver}' (lockstep broken)" >&2
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} == root == cli version ${root_ver}"

      # tsc only needs the typescript devDep; --ignore-scripts avoids the native addon builds
      # (better-sqlite3 / node-pty) that the CLI does not use.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build the CLI (dist/)
        run: pnpm --filter ./packages/cli run build

      # npm >= 11.5.1 is required for Trusted Publishing (OIDC). setup-node's Node 22 ships an
      # older npm, so pin an exact npm that satisfies the floor (Dependabot/manual bumps this).
      - name: Pin npm >= 11.5.1 (Trusted Publishing floor)
        run: |
          set -euo pipefail
          npm install -g npm@11.5.1
          npm --version

      # DEFENSE IN DEPTH (mirrors the release job's tarball re-scan): the mirror tree is already
      # sanitized, but re-verify the PUBLISHED SET here. Fails closed if (a) `npm pack` would ship
      # anything outside the allowlist {package.json, README.md, LICENSE, dist/**}, or (b) any
      # forbidden internal file / maintainer-coupling literal is inside the packed content. The
      # AUTHORITATIVE contract is INV-NPM-PACK-ALLOWLIST in scripts/test-release-prep.sh; this is
      # the publish-time backstop.
      - name: npm pack content gate (allowlist + leak scan)
        working-directory: packages/cli
        run: |
          set -euo pipefail
          dest="$(mktemp -d)"
          npm pack --pack-destination "$dest" >/dev/null
          tgz="$(find "$dest" -name '*.tgz' -print -quit)"
          [ -n "$tgz" ] || { echo "::error::npm pack produced no tarball" >&2; exit 1; }

          echo "== (a) every packed path is on the allowlist =="
          # `npm pack` prefixes every entry with `package/`. Strip it, then assert each remaining
          # path is package.json | README.md | LICENSE | dist/**. Capture-then-grep (NOT
          # `tar | grep`) to dodge the pipefail x SIGPIPE inversion on a match.
          listing="$(tar tzf "$tgz" | sed 's#^package/##' | grep -v '^$' || true)"
          bad="$(printf '%s\n' "$listing" | grep -vE '^(package\.json|README\.md|LICENSE|dist/.+)$' || true)"
          if [ -n "$bad" ]; then
            echo "::error::npm pack would ship files outside the allowlist:" >&2
            printf '%s\n' "$bad" >&2
            exit 1
          fi
          # Forbid .tsbuildinfo: a tsc build-cache file that bakes ABSOLUTE filesystem paths into
          # the tarball (kept out of dist via tsBuildInfoFile; blocked here as a structural backstop).
          tsb="$(printf '%s\n' "$listing" | grep -E '(^|/)\.tsbuildinfo$' || true)"
          if [ -n "$tsb" ]; then
            echo "::error::npm pack would ship a .tsbuildinfo (absolute-path leak vector): $tsb" >&2
            exit 1
          fi
          # Forbid *.map (SEC-1): source/declaration maps embed source-tree paths and are useless
          # to a CLI consumer; disabled at the tsc level (sourceMap/declarationMap:false) and
          # blocked here so a tsconfig flip re-emitting them can't ship silently.
          maps="$(printf '%s\n' "$listing" | grep -E '\.map$' || true)"
          if [ -n "$maps" ]; then
            echo "::error::npm pack would ship sourcemap(s) (path-embed vector): $maps" >&2
            exit 1
          fi
          # Required members must be present (a pack that dropped dist/ or LICENSE is also wrong).
          for req in package.json README.md LICENSE; do
            printf '%s\n' "$listing" | grep -qxF "$req" || { echo "::error::npm pack is missing $req" >&2; exit 1; }
          done
          printf '%s\n' "$listing" | grep -qE '^dist/index\.js$' || { echo "::error::npm pack is missing dist/index.js (the bin)" >&2; exit 1; }
          echo "ok: packed set == {package.json, README.md, LICENSE, dist/**}"

          echo "== (b) forbidden internal files absent from packed content (fail-closed) =="
          x="$(mktemp -d)"; tar xzf "$tgz" -C "$x"
          # Same posture as the release job's tarball re-scan: assert no forbidden INTERNAL file
          # is present. A generic maintainer-coupling literal scan is intentionally NOT inlined
          # here (it would embed the private path/handle into this shipped workflow); that scan is
          # the AUTHORITATIVE prepare-oss Phase-4 gate that runs BEFORE the mirror is cut, so the
          # tree this job packs is already coupling-clean by construction.
          hits="$(cd "$x" && find . \( -name '.env' -o -name '.mcp.json' -o -name 'CLAUDE.md' -o -name 'AGENTS.md' -o -name 'plan.md' -o -name '.claude' \) -print 2>/dev/null || true)"
          [ -z "$hits" ] || { echo "::error::forbidden internal file inside the npm package: $hits" >&2; exit 1; }
          echo "ok: packed content carries no forbidden internal file"
          rm -rf "$dest" "$x"

      # AUTHORITATIVE publish gate (mirrors the docker job's runtime guard): a step that runs
      # RIGHT BEFORE `npm publish` and fails closed unless the tag∧opt-in conditions truly hold.
      # Even if this job's `if:` were weakened, publishing is blocked here. GITHUB_REF /
      # GITHUB_EVENT_NAME are Actions built-ins; ENABLE_NPM_PUBLISH enters via env (injection-safe),
      # never interpolated into the script body.
      - name: Verify npm publish is authorized (runtime publish guard)
        env:
          ENABLE_NPM_PUBLISH: ${{ vars.ENABLE_NPM_PUBLISH }}
        run: |
          set -euo pipefail
          case "${GITHUB_REF:-}" in
            refs/tags/*) : ;;
            *) echo "::error::publish guard: ref '${GITHUB_REF:-}' is not a tag — refusing to publish" >&2; exit 1 ;;
          esac
          if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] || [ "${ENABLE_NPM_PUBLISH:-}" = "true" ]; then
            echo "npm publish authorized (event=${GITHUB_EVENT_NAME:-}, ENABLE_NPM_PUBLISH set: $([ "${ENABLE_NPM_PUBLISH:-}" = "true" ] && echo yes || echo no))"
          else
            echo "::error::publish guard: not workflow_dispatch and ENABLE_NPM_PUBLISH != 'true' — refusing to publish" >&2
            exit 1
          fi

      # Trusted Publishing: no NODE_AUTH_TOKEN, no .npmrc secret. npm (>= 11.5.1) exchanges the
      # OIDC token (id-token: write) for a publish credential and attaches provenance. --access
      # public publishes the unscoped `actradeck` package publicly; publishConfig also pins both.
      - name: Publish to npm (Trusted Publishing, OIDC — no token)
        working-directory: packages/cli
        run: npm publish --provenance --access public
